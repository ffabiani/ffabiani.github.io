<script>
(() => {
  const sheet = document.getElementById("dark-theme");
  const button = document.querySelector(
    '.masthead a[href$="#theme-toggle"]'
  );

  if (!sheet || !button) return;

  button.id = "theme-toggle";
  button.setAttribute("role", "button");

  const isDark = () => window.matchMedia(sheet.media).matches;

  function updateButton() {
    const dark = isDark();

    // Show the symbol for the mode clicking will activate.
    button.textContent = dark ? "\u2600\uFE0E" : "\u263E";

    const label = dark
      ? "Switch to light mode"
      : "Switch to dark mode";

    button.setAttribute("aria-label", label);
    button.title = label;
  }

  button.addEventListener("click", (event) => {
    event.preventDefault();

    const dark = !isDark();
    sheet.media = dark ? "all" : "not all";

    try {
      localStorage.setItem("site-theme", dark ? "dark" : "light");
    } catch (e) {}

    updateButton();
  });

  // Support the Space key as well as Enter.
  button.addEventListener("keydown", (event) => {
    if (event.key === " ") {
      event.preventDefault();
      if (!event.repeat) button.click();
    }
  });

  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", updateButton);

  updateButton();
})();
</script>

<span class="page__footer-counter" id="site-visitor-counter"
      aria-live="polite" aria-atomic="true" title="Total site visits, provided by GoatCounter">
  Visitors: <span id="site-visitor-count">—</span>
</span>

<script data-goatcounter="https://ffabiani.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
(() => {
  const counter = document.getElementById("site-visitor-counter");
  const value = document.getElementById("site-visitor-count");
  if (!counter || !value) return;

  // TOTAL shows the same site-wide count on every page.
  fetch("https://ffabiani.goatcounter.com/counter/TOTAL.json")
    .then((response) => {
      if (!response.ok) throw new Error("Counter unavailable");
      return response.json();
    })
    .then((data) => {
      if (data.count === undefined || data.count === null) {
        throw new Error("Counter unavailable");
      }
      value.textContent = String(data.count);
    })
    .catch(() => {
      // Keep the footer usable if the service is unavailable or blocked.
      counter.title = "Visitor count currently unavailable";
    });
})();
</script>
