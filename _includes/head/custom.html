<link rel="icon"
      type="image/png"
      href="{{ '/assets/images/favicon.png' | relative_url }}">

<link id="dark-theme"
      rel="stylesheet"
      href="{{ '/assets/css/dark.css' | relative_url }}"
      media="(prefers-color-scheme: dark)">

<script>
  try {
    const saved = localStorage.getItem("site-theme");

    if (saved === "dark" || saved === "light") {
      document.getElementById("dark-theme").media =
        saved === "dark" ? "all" : "not all";
    }
  } catch (e) {}
</script>

{% if page.browser_title %}
<script>
  document.title = {{ page.browser_title | jsonify }};
</script>
{% endif %}

<!-- Shared heading rules, applied after both theme stylesheets. -->
<style id="section-heading-rules">
  .page .page__content h1 {
    margin-top: 2rem;
    margin-bottom: 1rem;
    padding-bottom: 0.35em;
    border-bottom: 1px solid rgba(128, 128, 128, 0.4);
  }

    .page .page__content h2 {
    margin-bottom: 0.6rem;
  }

  .page h1.page__title {
    padding-bottom: 0;
    border-bottom: 0;
  }

  .page .page__content h2,
  .page .page__content h3,
  .page .page__content h4,
  .page .page__content h5,
  .page .page__content h6 {
    border-bottom: 0;
  }
</style>
