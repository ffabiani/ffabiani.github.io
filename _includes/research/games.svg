<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="research-games-title research-games-desc">
<title id="research-games-title">Local interaction and the geometry of equilibrium seeking</title>
<desc id="research-games-desc">A sparse communication network connects agents with individual objectives. A two-agent example shows a triangular joint feasible set, two best-response curves, an alternating-update path and their equilibrium intersection. The cost functions and geometry are illustrative rather than data from a publication.</desc>
