# Personal details: edit the values in quotation marks.
title: "Filippo Fabiani"
name: "Filippo Fabiani"
description: "Personal academic website of Filippo Fabiani."
url: "https://ffabiani.github.io"
baseurl: ""
repository: "ffabiani/ffabiani.github.io"
locale: "en-GB"
timezone: "Europe/Rome"

# Minimal Mistakes supplies the responsive layout, styles, and menus.
# A fixed release keeps the appearance stable between content updates.
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"
search: false
breadcrumbs: false

author:
  name: "Filippo Fabiani"
  avatar: "/assets/images/profile.jpg"
  bio: "Since May 2026, I am an Associate Professor in the DYSCO Research Unit at the IMT School for Advanced Studies Lucca, Lucca (IT). I received the B.Sc. degree in Bio-Engineering, the M.Sc. degree in Automatic Control Engineering, and the Ph.D. degree (cum laude) in Automatic Control, all from the University of Pisa (IT), in 2012, 2015, and 2019 respectively. In 2017-2018, I visited the Delft Center for Systems and Control at TU Delft (NL), where in 2018-2019 I spent one year as post-doctoral Research Fellow. Successively, in 2019-2022 I was Post-Doctoral Research Assistant in the Control Group at the Department of Engineering Science, University of Oxford (UK). \n My research to date has been at the intersection of machine learning, game theory and control engineering, and concentrates on developing both data-driven theoretical tools and algorithmic methods for modern control design. These include optimal control of multi-agent and uncertain systems such as power and traffic network, and emerging control applications in smart grids and smart cities."
  location: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ffabiani"
    # To add a link, remove the # at the start of its three lines,
    # then replace the example address with your own.
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope"
    #   url: "mailto:YOUR-EMAIL"
    # - label: "Google Scholar"
    #   icon: "fas fa-fw fa-graduation-cap"
    #   url: "YOUR-GOOGLE-SCHOLAR-URL"
    # - label: "University profile"
    #   icon: "fas fa-fw fa-building-columns"
    #   url: "YOUR-UNIVERSITY-PROFILE-URL"

# Leave empty until you upload the PDF. Example: "/assets/files/CV.pdf".
cv_file: "/assets/files/CV_FF.pdf"

atom_feed:
  hide: true

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

exclude:
  - README.md
  - SETUP.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - assets/files/README.md
